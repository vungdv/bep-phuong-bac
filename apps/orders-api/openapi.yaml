openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: >
    Backend for the order-management front-end: list one day's orders and set an order's
    delivered flag. Source of truth for requirements B1-B24 and O1-O5; route tests validate
    every response against this document.
servers:
  - url: http://localhost:8080
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List the orders of one service day, sorted by `no`
      parameters:
        - name: serviceDate
          in: query
          required: true
          description: A real calendar date, YYYY-MM-DD. Other query parameters are ignored.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Orders of that day; an empty array when there are none.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoCache' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: setDelivered
      summary: Set (never toggle) the delivered flag of an order
      description: JSON Merge Patch (RFC 7396). Idempotent. Only `delivered` may be named.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/DeliveredPatch' }
      responses:
        '200':
          description: The updated order.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /healthz:
    get:
      operationId: liveness
      summary: Liveness; no dependencies
      responses:
        '200':
          description: The process is up.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { const: ok } }
                additionalProperties: false
  /readyz:
    get:
      operationId: readiness
      summary: Readiness; the store is reachable and the schema is current
      responses:
        '200':
          description: Ready to serve.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { const: ready } }
                additionalProperties: false
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. When present the API continues that trace.
      schema: { type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }
  headers:
    Traceparent:
      required: true
      description: W3C Trace Context of the server span for this request.
      schema: { type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }
    CacheControlNoCache:
      required: true
      schema: { const: no-cache }
    CacheControlNoStore:
      required: true
      schema: { const: no-store }
  schemas:
    Order:
      type: object
      required: [id, no, name, qty, message, createdAt, serviceDate, delivered]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        no: { type: integer, minimum: 1 }
        name: { type: string }
        qty: { type: integer, minimum: 1 }
        message: { type: string, description: Empty string when there is no message. }
        createdAt: { type: string, format: date-time, description: ISO 8601 with a UTC offset. }
        serviceDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        delivered: { type: boolean }
    DeliveredPatch:
      type: object
      required: [delivered]
      additionalProperties: false
      properties:
        delivered: { type: boolean }
    Problem:
      description: RFC 7807 Problem Details with a `trace_id` extension member.
      type: object
      required: [type, title, status, detail, trace_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
  responses:
    BadRequest:
      description: Invalid or missing `serviceDate`, or an invalid patch body.
      headers: { traceparent: { $ref: '#/components/headers/Traceparent' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    NotFound:
      description: No order has that id (or the id is not a UUID).
      headers: { traceparent: { $ref: '#/components/headers/Traceparent' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    MethodNotAllowed:
      description: Unsupported method; `Allow` lists the supported ones.
      headers:
        traceparent: { $ref: '#/components/headers/Traceparent' }
        Allow:
          required: true
          schema: { type: string, examples: ['GET, HEAD', PATCH] }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    UnsupportedMediaType:
      description: The body is not `application/merge-patch+json`.
      headers:
        traceparent: { $ref: '#/components/headers/Traceparent' }
        Accept-Patch:
          required: true
          schema: { const: application/merge-patch+json }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    InternalError:
      description: Unexpected failure; no SQL or stack trace is leaked.
      headers: { traceparent: { $ref: '#/components/headers/Traceparent' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    Unavailable:
      description: The order store is unreachable (or the service is not ready).
      headers: { traceparent: { $ref: '#/components/headers/Traceparent' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
