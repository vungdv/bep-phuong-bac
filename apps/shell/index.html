<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bep Phuong Bac</title>
    <style>
      :root {
        --mf-color-primary: #b3261e;
        --mf-color-bg: #fffaf5;
        --mf-color-text: #2b2118;
        --mf-color-error: #b00020;
        --mf-font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
        --mf-spacing: 1rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --mf-color-primary: #ff8a80;
          --mf-color-bg: #1c1612;
          --mf-color-text: #f3e9df;
          --mf-color-error: #ff6b6b;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--mf-color-bg);
        color: var(--mf-color-text);
        font-family: var(--mf-font-family);
        line-height: 1.5;
      }
      #mf-outlet {
        display: block;
        min-height: 100vh;
        box-sizing: border-box;
        padding: var(--mf-spacing);
      }
    </style>
  </head>
  <body>
    <main id="mf-outlet"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
