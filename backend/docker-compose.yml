services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bpb
      POSTGRES_USER: bpb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpb -d bpb"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Set to true only behind a trusted TLS-terminating proxy (nginx + tunnel): honours X-Forwarded-Proto/For so the
      # OIDC issuer and endpoints are https. It trusts any caller's headers, so never expose port 5080 directly then.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${FORWARDED_HEADERS_ENABLED:-false}
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__DatabaseConnectionString: "Host=postgres;Port=5432;Database=bpb;Username=bpb;Password=${POSTGRES_PASSWORD}"
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__AdminPassword: ${ADMIN_PASSWORD:?set in .env}
      OrchardCore__Bpb__ScriptClientSecret: ${SCRIPT_CLIENT_SECRET:?set in .env}
      OrchardCore__Bpb__UiRedirectUris: ${UI_REDIRECT_URIS:-}
      OrchardCore__Bpb__CorsAllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      # LLM Extract activity (module Bpb.Workflows.Llm), read as Bpb:Llm:* by the tenant. Defaults: the `ollama` service
      # below. `make test-backend` points LLM_ENDPOINT at the `llm-stub` service instead.
      OrchardCore__Bpb__Llm__Endpoint: ${LLM_ENDPOINT:-http://ollama:11434}
      OrchardCore__Bpb__Llm__Model: ${LLM_MODEL:-qwen2.5:7b-instruct}
      OrchardCore__Bpb__Llm__TimeoutSeconds: ${LLM_TIMEOUT_SECONDS:-120}
      OrchardCore__Bpb__Llm__ApiKey: ${LLM_API_KEY:-}
    volumes:
      # Orchard tenant state (App_Data: shell settings and the data-protection keys that protect cookies and
      # encrypted tokens). Without it a recreated container re-runs AutoSetup against the existing database and fails.
      - appdata:/app/App_Data
      - dpkeys-host:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  # Local model server (Ollama, OpenAI-compatible API). Profile `llm`: NOT started by `make stack-up`, because the model is a
  # multi-GB download. Start it with `make llm-up`, pull the model once with `make llm-pull`. It publishes no host port, so it
  # never clashes with an Ollama already running on the host (localhost:11434); to use that one instead set
  # LLM_ENDPOINT=http://host.docker.internal:11434 in .env and skip this service.
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Deterministic stand-in for the LLM endpoint, for tests only (see llm-stub/server.cjs). Profile `test`.
  llm-stub:
    profiles: ["test"]
    build: ./llm-stub
    ports:
      - "127.0.0.1:${LLM_STUB_PORT:-5099}:8080"

volumes:
  pgdata:
  ollama:
  appdata:
  dpkeys-host:
