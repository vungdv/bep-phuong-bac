services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bpb
      POSTGRES_USER: bpb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpb -d bpb"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__DatabaseConnectionString: "Host=postgres;Port=5432;Database=bpb;Username=bpb;Password=${POSTGRES_PASSWORD}"
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__AdminPassword: ${ADMIN_PASSWORD:?set in .env}
      OrchardCore__Bpb__ScriptClientSecret: ${SCRIPT_CLIENT_SECRET:?set in .env}
      OrchardCore__Bpb__UiRedirectUris: ${UI_REDIRECT_URIS:-}
      OrchardCore__Bpb__CorsAllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      # Orchard tenant state (App_Data: shell settings and the data-protection keys that protect cookies and
      # encrypted tokens). Without it a recreated container re-runs AutoSetup against the existing database and fails.
      - appdata:/app/App_Data
      - dpkeys-host:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  pgdata:
  appdata:
  dpkeys-host:
