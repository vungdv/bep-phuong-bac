# Single public origin behind a Cloudflare quick tunnel.
# Files of the built shell (index.html, assets/, remotes/, *.config.json) are served directly;
# every other path (OIDC /connect, /api, /Login, ...) goes to the Orchard Core backend on the Docker host.
map $http_x_forwarded_proto $public_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri @backend;
    }

    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://host.docker.internal:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_read_timeout 60s;
    }
}
