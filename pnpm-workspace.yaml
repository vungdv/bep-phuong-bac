packages:
  - apps/*
  - packages/*
# jest-dom imports `vitest` (types + runtime) without declaring it; without this it
# resolves to whichever vitest variant pnpm hoists, which splits from the test's instance.
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true
